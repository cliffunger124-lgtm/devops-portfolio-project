stages:
  - build
  - deploy

build-job:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "--- Логин в Docker Hub ---"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - echo "--- Сборка образа ---"
    - docker build -t $DOCKERHUB_USER/my-portfolio1:$CI_COMMIT_SHORT_SHA ./app
    - docker tag $DOCKERHUB_USER/my-portfolio1:$CI_COMMIT_SHORT_SHA $DOCKERHUB_USER/my-portfolio1:latest
    - echo "--- Пуш образа ---"
    - docker push $DOCKERHUB_USER/my-portfolio1:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_USER/my-portfolio1:latest

deploy-job:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > /tmp/id_ed25519
    - chmod 600 /tmp/id_ed25519
    - ssh-add /tmp/id_ed25519
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 79.133.181.40 >> ~/.ssh/known_hosts
  script:
    - echo "--- Деплой в Kubernetes ---"
    - ssh devops@79.133.181.40 "export KUBECONFIG=/home/devops/.kube/config && kubectl set image deployment/portfolio1 *= $DOCKERHUB_USER/my-portfolio1:$CI_COMMIT_SHORT_SHA"
