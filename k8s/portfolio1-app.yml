apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio1-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio1-web
  template:
    metadata:
      labels:
        app: portfolio1-web
    spec:
      containers:
      - name: nginx
        image: tytsvaga/my-portfolio1:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio1-service
spec:
  type: NodePort
  selector:
    app: portfolio1-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio1-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  tls:
  - hosts:
    - das-devops.site
    secretName: portfolio1-tls-secret
  rules:
  - host: das-devops.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio1-service
            port:
              number: 80
